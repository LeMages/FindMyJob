[package]
name = "findmyjob"
version = "0.1.0"
description = "FindMyJob — suivi de candidatures"
authors = []
edition = "2021"

[lib]
name = "findmyjob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exceptions réservées aux tests (ex. récupération sur un serveur local de
# bouclage). Activée seulement par la dev-dependency sur ce paquet lui-même :
# jamais présente dans un build de l'application.
test-support = []

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
open = { workspace = true }
dotenvy = { workspace = true }
keyring = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# Déjà présent via Tauri : `rt` pour spawn_blocking (compilations Typst),
# `time` pour la purge différée du suivi de génération, `net` pour le
# résolveur DNS filtrant de l'import d'offre.
tokio = { workspace = true, features = ["rt", "time", "net"] }
reqwest = { workspace = true }
scraper = { workspace = true }
url = { workspace = true }
typst-as-lib = { workspace = true }
typst-pdf = { workspace = true }
typst-layout = { workspace = true }
typst-library = { workspace = true }
typst-syntax = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# `test-support` : exceptions compilées pour les tests seulement (ex.
# récupération sur un serveur local) ; jamais activée par `[dependencies]`.
findmyjob = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["rt"] }
wiremock = { workspace = true }
