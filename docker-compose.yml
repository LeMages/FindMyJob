services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-findmyjob}
      POSTGRES_USER: ${DB_USER:-findmyjob}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-findmyjob}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-findmyjob}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-findmyjob}
      DB_PASSWORD: ${DB_PASSWORD:-findmyjob}
      DB_DATABASE: ${DB_DATABASE:-findmyjob}
      CRON_INTERVAL: ${CRON_INTERVAL:-6h}
      API_TOKEN: ${API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_DIR: /app/data
      FONTS_DIR: /app/data/fonts
      AGENT_CONFIG_PATH: /app/agent.toml
    volumes:
      - agent-data:/app/data
      - ./agent.toml:/app/agent.toml:ro

volumes:
  pgdata:
  agent-data:
