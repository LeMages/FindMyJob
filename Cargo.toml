[workspace]
members = ["crates/core", "crates/desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "cookies"] }
chrono = "0.4"
open = "5"
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
typst-layout = "0.15"
typst-library = "0.15"
typst-syntax = "0.15"
base64 = "0.22"
scraper = "0.22"
url = "2"
dotenvy = "0.15"
# Trousseau du système (clé API en mode PROD) : `v1` active seulement les
# backends natifs Windows, macOS et Secret Service (Linux).
keyring = { version = "4.2", default-features = false, features = ["v1"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Tests uniquement : serveur HTTP local des tests d'import d'offre.
wiremock = "0.6"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
