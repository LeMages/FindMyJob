[package]
name = "findmyjob-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "findmyjob_core"

[features]
# Exceptions réservées aux tests (ex. récupération sur un serveur local de
# bouclage). Activée seulement par les dev-dependencies de `findmyjob` :
# jamais présente dans un build de l'application.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
scraper = { workspace = true }
url = { workspace = true }
