[package]
name = "findmyjob"
version = "0.1.0"
description = "FindMyJob — suivi de candidatures"
authors = []
edition = "2021"

[lib]
name = "findmyjob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
findmyjob-core = { path = "../../core" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
open = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
# Déjà présent via Tauri : `rt` pour spawn_blocking (compilations Typst),
# `time` pour la purge différée du suivi de génération.
tokio = { workspace = true, features = ["rt", "time"] }
typst-as-lib = { workspace = true }
typst-pdf = { workspace = true }
typst-layout = { workspace = true }
typst-library = { workspace = true }
typst-syntax = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
