name: Build check

# Build Tauri complet sur chaque plateforme de release, avant la fusion vers
# staging ou main : même matrice et même préparation que release.yml, sans
# version injectée, sans publication et sans upload.

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/desktop/package-lock.json

      # Version, composants et cibles (dont les deux cibles macOS) lus dans
      # rust-toolchain.toml.
      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci
        working-directory: crates/desktop

      - name: Build Tauri
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: crates/desktop
