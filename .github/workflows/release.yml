name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github @semantic-release/exec

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Exposer la version
        id: release
        run: |
          if [ -f .VERSION ]; then
            VERSION=$(cat .VERSION)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # cache-key : une clé de cache par cible, identique dans build-check.yml.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            cache-key: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            cache-key: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            cache-key: ubuntu
          - platform: windows-latest
            args: ""
            cache-key: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # Version, composants et cibles (dont les deux cibles macOS) lus dans
      # rust-toolchain.toml.
      - name: Setup Rust
        run: rustup toolchain install

      # Restaure les caches sauvegardés par build-check.yml sur push vers dev
      # (branche par défaut) ; la Release ne sauvegarde jamais. Le cache est
      # restauré avant « Inject version » : la clé ne dépend pas de la version.
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-build-${{ matrix.cache-key }}
          save-if: false

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # tauri.conf.json lit sa version dans ../package.json : on ne l'écrit pas.
      # Cargo.lock n'est pas réécrit : cargo met à jour l'entrée du paquet
      # lui-même au build (aucun --locked dans ce workflow).
      - name: Inject version
        shell: bash
        run: |
          VERSION=${{ needs.version.outputs.version }}
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: FindMyJob v${{ needs.version.outputs.version }}
          releaseBody: Télécharge le fichier correspondant à ton OS ci-dessous.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
